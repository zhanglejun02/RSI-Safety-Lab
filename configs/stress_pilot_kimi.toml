# New-root development pilot; separate from the old retail continuation budget.
# 4 domains x 2 roots x 2 systems x H3 = at most 48 editor dispatches / 800k tokens.
[experiment]
domains = ["authorization", "finance", "retail", "privacy"]
seeds = [2026110301, 2026110302]
horizon = 3

[model]
provider = "http"
base_url = "https://api.moonshot.cn/v1"
model = "kimi-k2.6"
api_key_env = "MOONSHOT_API_KEY"
temperature = 0.6
thinking_mode = "disabled"
max_output_tokens = 4096
max_calls = 3
max_total_tokens = 50000
max_prompt_bytes = 40000
timeout_seconds = 120.0
